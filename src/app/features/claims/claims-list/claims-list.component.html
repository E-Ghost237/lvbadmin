<app-breadcrumbs [crumbs]="[{ label: i18n.t('nav.claims') }]" />

<div class="mb-5">
  <h1 class="text-xl font-semibold">{{ i18n.t('nav.claims') }}</h1>
  <p class="text-sm mt-0.5" style="color: var(--text-muted)">Qualification, arbitrage et suivi des délais SLA.</p>
</div>

<div class="card p-4 mb-4">
  <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
    <app-search-input placeholder="Numéro, commande, client…" (searchChange)="onSearch($event)" />
    <select class="select" [value]="statut()" (change)="statut.set($any($event.target).value); applyFilters()">
      <option value="TOUS">Tous les statuts</option>
      <option value="OUVERTE">{{ i18n.t('status.claim.OUVERTE') }}</option>
      <option value="EN_COURS">{{ i18n.t('status.claim.EN_COURS') }}</option>
      <option value="ESCALADEE">{{ i18n.t('status.claim.ESCALADEE') }}</option>
      <option value="RESOLUE">{{ i18n.t('status.claim.RESOLUE') }}</option>
      <option value="FERMEE">{{ i18n.t('status.claim.FERMEE') }}</option>
    </select>
    <select class="select" [value]="gravite()" (change)="gravite.set($any($event.target).value); applyFilters()">
      <option value="TOUS">Toutes gravités</option>
      <option value="FAIBLE">{{ i18n.t('gravity.FAIBLE') }}</option>
      <option value="MOYENNE">{{ i18n.t('gravity.MOYENNE') }}</option>
      <option value="HAUTE">{{ i18n.t('gravity.HAUTE') }}</option>
      <option value="CRITIQUE">{{ i18n.t('gravity.CRITIQUE') }}</option>
    </select>
  </div>
</div>

<div class="card overflow-hidden">
  <app-data-table [columns]="columns" [rows]="rows()" [loading]="loading()" [rowClickable]="true" (rowClick)="openClaim($event)" emptyTitle="Aucune réclamation">
    <ng-template appCell="gravite" let-row><app-status-badge domain="gravity" [status]="row.gravite" /></ng-template>
    <ng-template appCell="statut" let-row><app-status-badge domain="claim" [status]="row.statut" /></ng-template>
    <ng-template appCell="echeance_sla" let-row>
      <span [style.color]="isOverdue(row) ? 'var(--status-critical)' : 'var(--text-primary)'">{{ formatDateTime(row.echeance_sla) }}</span>
    </ng-template>
  </app-data-table>
</div>
