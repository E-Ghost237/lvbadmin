<div class="min-h-screen flex items-center justify-center p-4 sm:p-6" style="background: var(--surface-2)">
  <div class="w-full max-w-sm flex flex-col items-center">
    <div class="flex flex-col items-center gap-3 mb-8">
      <img src="/logo/Logo_lvb_trimmed.png" alt="LVB" class="h-14 w-auto shrink-0" />
      <p class="text-sm font-bold" style="font-family: var(--font-heading)">{{ i18n.t('app.name') }}</p>
    </div>

    <div class="w-full rounded-(--radius-lg) overflow-hidden" style="background: var(--surface-1); border: 1px solid var(--border); box-shadow: var(--shadow-md)">
      <div class="h-1 w-full" style="background: linear-gradient(90deg, var(--brand) 0%, var(--accent) 100%)"></div>
      <div class="p-8 sm:p-10">
        <h1 class="text-xl font-semibold">{{ i18n.t('auth.forgot.title') }}</h1>
        <p class="text-sm mt-1 mb-6" style="color: var(--text-muted)">{{ i18n.t('auth.forgot.subtitle') }}</p>

        @if (sent()) {
          <app-alert-banner kind="success">{{ i18n.t('auth.forgot.sent') }}</app-alert-banner>
          <a routerLink="/login" class="btn btn-secondary w-full mt-4">{{ i18n.t('action.back') }}</a>
        } @else {
          <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4" novalidate>
            <app-field [label]="i18n.t('auth.login.email')" [control]="form.controls.email" required>
              <input type="email" class="input" formControlName="email" autocomplete="username" [class.input-invalid]="form.controls.email.invalid && form.controls.email.touched" />
            </app-field>
            <button type="submit" class="btn btn-primary w-full" [disabled]="submitting()">{{ i18n.t('auth.forgot.submit') }}</button>
            <a routerLink="/login" class="btn btn-ghost w-full">{{ i18n.t('action.back') }}</a>
          </form>
        }
      </div>
    </div>
  </div>
</div>
