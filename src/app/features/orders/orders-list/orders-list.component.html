<app-breadcrumbs [crumbs]="[{ label: i18n.t('nav.orders') }]" />

<div class="flex items-center justify-between gap-3 mb-5 flex-wrap">
  <div>
    <h1 class="text-xl font-semibold">{{ i18n.t('nav.orders') }}</h1>
    <p class="text-sm mt-0.5" style="color: var(--text-muted)">Suivi, affectation manuelle et annulation des commandes.</p>
  </div>
</div>

<div class="card p-4 mb-4">
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-3">
    <div class="lg:col-span-2">
      <app-search-input placeholder="Numéro, client, livreur…" (searchChange)="onSearch($event)" />
    </div>
    <select class="select" [value]="statut()" (change)="statut.set($any($event.target).value); page.set(1)">
      @for (s of statusOptions; track s) { <option [value]="s">{{ statusLabel(s) }}</option> }
    </select>
    <select class="select" [value]="ville()" (change)="ville.set($any($event.target).value); page.set(1)">
      <option value="TOUS">{{ i18n.t('common.all') }} — villes</option>
      <option value="Douala">Douala</option>
      <option value="Yaoundé">Yaoundé</option>
    </select>
    <select class="select" [value]="period()" (change)="period.set($any($event.target).value); page.set(1)">
      <option value="TOUS">{{ i18n.t('common.all') }} — dates</option>
      <option value="today">{{ i18n.t('common.today') }}</option>
      <option value="7">{{ i18n.t('common.last7days') }}</option>
      <option value="30">{{ i18n.t('common.last30days') }}</option>
    </select>
  </div>
  <div class="flex justify-end mt-2">
    <button type="button" class="btn btn-ghost btn-sm" (click)="resetFilters()">{{ i18n.t('action.reset') }}</button>
  </div>
</div>

<div class="card overflow-hidden">
  <app-data-table
    [columns]="columns" [rows]="rows()" [loading]="loading()" [rowClickable]="true"
    emptyTitle="Aucune commande" emptyHint="Ajustez vos filtres pour élargir la recherche."
    (rowClick)="openOrder($event)"
  >
    <ng-template appCell="statut" let-row><app-status-badge domain="order" [status]="row.statut" /></ng-template>
    <ng-template appCell="canal" let-row>
      <span class="text-xs" style="color: var(--text-muted)">{{ row.canal === 'TELECONSEILLER' ? 'Téléconseiller' : row.canal === 'APP_CLIENT' ? 'Application' : row.canal }}</span>
    </ng-template>
  </app-data-table>
  <app-pagination [page]="page()" [pageSize]="pageSize()" [total]="total()" (pageChange)="page.set($event)" (pageSizeChange)="pageSize.set($event); page.set(1)" />
</div>
