# Run on the Contabo host itself — built and started there by the GitLab CI
# deploy job over SSH, so the runner never needs Docker access.
services:
  lvbadmin:
    build:
      context: .
      dockerfile: Dockerfile
    image: lvbadmin:latest
    container_name: lvbadmin
    restart: unless-stopped
    ports:
      - "${LVBADMIN_HTTP_PORT:-5050}:4000"

  partner-portal:
    build:
      context: .
      dockerfile: Dockerfile.partner
    image: lvb-partner-portal:latest
    container_name: lvb-partner-portal
    restart: unless-stopped
    ports:
      - "${PARTNER_PORTAL_HTTP_PORT:-5051}:80"
